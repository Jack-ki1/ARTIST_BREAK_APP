name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  package:
    name: Assemble validated source bundle
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Assemble source and production assets
        run: |
          mkdir -p .release/ARTIST_BREAK_APP/frontend/dist
          git archive HEAD | tar -x -C .release/ARTIST_BREAK_APP
          cp -a frontend/dist/. .release/ARTIST_BREAK_APP/frontend/dist/
          (cd .release && zip -qr ../ARTIST_BREAK_APP.zip ARTIST_BREAK_APP)
          unzip -t ARTIST_BREAK_APP.zip
      - name: Upload rebuild ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ARTIST_BREAK_APP-rebuild
          path: ARTIST_BREAK_APP.zip
          if-no-files-found: error
          retention-days: 14
