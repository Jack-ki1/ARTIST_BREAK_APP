name: Materialize Breakout Radar v3.1
on:
  push:
    branches:
      - automation/v3.1-reference-refresh-20261104
permissions:
  contents: write
jobs:
  apply-source-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate and apply the source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/patch-*.part | base64 -d | xz -t
          cat .release/patch-*.part | base64 -d | xz -dc | git apply --check
          cat .release/patch-*.part | base64 -d | xz -dc | git apply
          rm -rf .release
          rm -f .github/workflows/materialize-v3.1.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild Breakout Radar v3.1 with reference UX and autonomous intelligence'
          git push origin HEAD:${GITHUB_REF_NAME}
